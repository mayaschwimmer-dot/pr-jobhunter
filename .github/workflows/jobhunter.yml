# הערות חשובות:
# 1. מומלץ שהמאגר (repo) יהיה PUBLIC - ב-GitHub Actions דקות הרצה בחינם ללא הגבלה למאגרים ציבוריים.
#    בקבצי המאגר אין מידע אישי (הסיסמאות נמצאות ב-Secrets בלבד).
# 2. הקומיט של data/seen.json חוזר למאגר בכל שינוי; פעילות במאגר מונעת מ-GitHub
#    לכבות אוטומטית workflow מתוזמן אחרי 60 יום ללא פעילות.
# 3. Secrets להגדרה (Settings > Secrets and variables > Actions): GMAIL_USER, GMAIL_APP_PASSWORD, ALERT_TO
name: jobhunter

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobhunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run jobhunter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          PYTHONIOENCODING: utf-8
        run: python -m jobhunter.main

      - name: Commit state
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "jobhunter-bot"
            git config user.email "jobhunter-bot@users.noreply.github.com"
            git add data/seen.json
            git commit -m "update seen.json"
            git pull --rebase
            git push
          fi
